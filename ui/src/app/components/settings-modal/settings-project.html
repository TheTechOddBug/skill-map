<section
  class="settings-project"
  [attr.aria-labelledby]="'settings-project-heading'"
  data-testid="settings-project"
>
  <h2 id="settings-project-heading" class="settings-project__title">
    {{ texts.project.heading }}
  </h2>
  <p class="settings-project__intro">
    {{ texts.project.introPrefix }}
    <code class="settings-project__intro-path">{{ texts.project.introPath }}</code>{{ texts.project.introSuffix }}
  </p>

  <sm-settings-project-lens [visible]="visible()" />
  <sm-settings-project-capture [visible]="visible()" />
  <sm-settings-project-preferences [visible]="visible()" />
  <sm-settings-project-ignore [visible]="visible()" />
</section>
