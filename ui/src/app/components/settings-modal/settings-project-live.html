<div class="settings-project__row" data-testid="settings-project-live-updates-row">
  <div class="settings-project__row-text">
    <div class="settings-project__row-label">{{ texts.project.live.ws.label }}</div>
    <div class="settings-project__row-description">
      {{ texts.project.live.ws.description }}
    </div>
  </div>
  <p-toggleswitch
    [ngModel]="liveWsEnabled()"
    (ngModelChange)="onLiveWsToggle($event)"
    data-testid="settings-project-live-updates-toggle"
  />
</div>
