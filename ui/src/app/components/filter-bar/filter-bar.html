<div class="filter-bar" data-testid="filter-bar">
  <p-iconfield iconPosition="left" class="filter-bar__search">
    <p-inputicon styleClass="fa-solid fa-magnifying-glass" />
    <input
      pInputText
      type="text"
      [placeholder]="texts.searchPlaceholder"
      [ngModel]="searchText()"
      (ngModelChange)="onSearchChange($event)"
      data-testid="filter-search"
    />
  </p-iconfield>

  @if (showKinds()) {
    <p-multiselect
      [options]="kindOptions()"
      [ngModel]="selectedKinds()"
      (ngModelChange)="onKindsChange($event)"
      optionLabel="label"
      optionValue="value"
      [placeholder]="texts.allKindsPlaceholder"
      display="chip"
      styleClass="filter-bar__ms"
      [showToggleAll]="false"
      [filter]="false"
      data-testid="filter-kinds"
    />
  }

  <p-multiselect
    [options]="stabilityOptions"
    [ngModel]="selectedStabilities()"
    (ngModelChange)="onStabilitiesChange($event)"
    optionLabel="label"
    optionValue="value"
    [placeholder]="texts.allStabilitiesPlaceholder"
    display="chip"
    styleClass="filter-bar__ms"
    [showToggleAll]="false"
    [filter]="false"
    data-testid="filter-stabilities"
  />

  <p-togglebutton
    [ngModel]="hasIssuesOnly()"
    (ngModelChange)="onIssuesToggle($event)"
    [onLabel]="texts.hasIssues"
    [offLabel]="texts.hasIssues"
    onIcon="fa-solid fa-triangle-exclamation"
    offIcon="fa-solid fa-triangle-exclamation"
    styleClass="filter-bar__toggle"
    data-testid="filter-has-issues"
  />

  <p-togglebutton
    [ngModel]="staleOnly()"
    (ngModelChange)="onStaleOnlyToggle($event)"
    [onLabel]="texts.staleOnly"
    [offLabel]="texts.staleOnly"
    onIcon="fa-solid fa-clock"
    offIcon="fa-solid fa-clock"
    styleClass="filter-bar__toggle"
    data-testid="filter-stale-only"
  />

  @if (showFavoritesToggle()) {
    <p-togglebutton
      [ngModel]="favoritesOnly()"
      (ngModelChange)="onFavoritesOnlyToggle($event)"
      [onLabel]="texts.favoritesOnly"
      [offLabel]="texts.favoritesOnly"
      onIcon="fa-solid fa-star"
      offIcon="fa-regular fa-star"
      styleClass="filter-bar__toggle"
      data-testid="filter-favorites-only"
    />
  }

  @if (isActive()) {
    <p-button
      [label]="texts.reset"
      severity="secondary"
      [text]="true"
      size="small"
      (onClick)="reset()"
      data-testid="filter-reset"
    />
  }
</div>
