<!--
  WAI-ARIA Accordion pattern: the section title is exposed as a level-3
  heading wrapping the interactive toggle button. A `role="heading"` set
  directly on a span *inside* the button would be flattened (a button
  collapses its subtree to compute its name), so the heading sits around
  the button instead. This keeps the button as the sole interactive
  control while giving AT a real heading in the level ladder (h1 shell >
  h2 inspector-header > h3 section title).
-->
<div role="heading" aria-level="3" class="sm-block__heading">
  <button
    type="button"
    class="sm-block__row sm-block__row--toggle"
    (click)="toggle.emit()"
    [attr.aria-expanded]="expanded()"
    [attr.aria-controls]="bodyId"
    [attr.aria-label]="toggleAriaLabel() ?? null"
    [pTooltip]="toggleTooltip() ?? ''"
    [attr.data-testid]="toggleTestid() ?? null"
  >
    <span class="sm-block__title" [id]="titleId">
      {{ title() }}
      <ng-content select="[smSectionTitleExtra]"></ng-content>
    </span>
    <i
      class="pi sm-block__chevron"
      [class.pi-chevron-right]="!expanded()"
      [class.pi-chevron-down]="expanded()"
      aria-hidden="true"
    ></i>
  </button>
</div>
<!--
  The body is a NAMED REGION (WCAG 1.3.1), not a bare projection: up to
  ten of these stack in one inspector panel, and without a region a
  screen-reader user has no landmark to jump between them, nor any way to
  tell where one section's content ends and the next begins. It is also
  the `aria-controls` target of the toggle above, which closes the
  disclosure contract (`aria-expanded` alone says "something expands"
  without saying what).

  `<ng-content>` is deliberately NOT wrapped in an `@if`: Angular's
  content-projection guide is explicit that `<ng-content>` must not be
  conditionally included with `@if` / `@for` / `@switch` (the projected
  nodes are created eagerly and keep the DECLARING view's lifecycle), so
  the wrapper always renders and the CALLER keeps owning whether the body
  exists at all. `:empty` in the styles below is what hides the wrapper
  in the collapsed state, so the global divider rule
  (`.sm-block--collapsible > .sm-block__heading + *`) does not paint a
  hairline under a section with nothing in it.

  Written with no whitespace around the projection so the wrapper is
  genuinely empty (a text node would defeat `:empty`; comment nodes, like
  the anchors the caller's own `@if` leaves behind, do not).
-->
<div
  class="sm-block__body"
  [id]="bodyId"
  role="region"
  [attr.aria-labelledby]="titleId"
><ng-content></ng-content></div>
