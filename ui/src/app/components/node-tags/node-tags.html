<!--
  Two modes. VIEW: a `TAGS:` title, the filter chips (click selects every
  node carrying the tag on the map), and a pencil that opens the inline
  editor; the title + pencil are always shown so a node with no tags reads
  as an empty tag row rather than a lone pencil.
  EDIT: the string-list control (add / remove) with Save / Cancel. It is
  reached by the pencil, or automatically when an auto-tag run hands back
  a proposal (the editor opens pre-filled and unsaved, see the component's
  `autoOpenOnProposal`); there is no separate proposal surface.
-->
@if (!editing()) {
  <div class="node-tags" data-testid="node-tags">
    <span class="node-tags__label">{{ texts.viewLabel }}:</span>
    @for (tag of tags(); track tag) {
      <button
        type="button"
        class="node-tags__tag"
        [class.node-tags__tag--active]="isActive(tag)"
        [attr.aria-pressed]="isActive(tag)"
        [attr.aria-label]="texts.tagFilterAriaLabel(tag)"
        (click)="onChipClick(tag)"
        data-testid="node-tags-tag"
      >
        <i class="pi pi-tag" aria-hidden="true"></i>
        {{ tag }}
      </button>
    }
    <button
      type="button"
      class="node-tags__edit"
      [pTooltip]="editTooltip()"
      [attr.aria-label]="editTooltip()"
      (click)="startEdit()"
      data-testid="node-tags-edit"
    >
      <i class="pi pi-pencil" aria-hidden="true"></i>
    </button>
    <!-- Auto-tag affordance (user request 2026-07-21): idle queues
         `core/ai-tagger-action`; the record path writes the inferred tags
         into the sidecar, so the chips refresh on the next broadcast. -->
    @if (autoTagState() !== 'hidden') {
      <button
        type="button"
        class="node-tags__auto"
        [disabled]="autoTagDisabled()"
        [pTooltip]="autoTagTooltip()"
        tooltipPosition="left"
        [attr.aria-label]="autoTagTooltip()"
        (click)="onAutoTagClick()"
        [attr.data-state]="autoTagState()"
        smDebugSurface="inspector.surface.auto-tag"
        data-testid="node-tags-auto"
      >
        @switch (autoTagState()) {
          @case ('queued') {
            <i class="pi pi-clock" aria-hidden="true"></i>
          }
          @case ('running') {
            <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
          }
          @default {
            <i class="pi pi-sparkles" aria-hidden="true"></i>
          }
        }
      </button>
    }
  </div>
} @else {
  <div class="node-tags node-tags--editing" data-testid="node-tags-editor">
    @defer (on immediate) {
      <sm-input-type-control
        class="node-tags__control"
        size="small"
        [descriptor]="descriptor()"
        [value]="draft()"
        (valueChange)="onDraftChange($event)"
      />
    }

    <div class="node-tags__actions">
      <p-button
        size="small"
        [label]="texts.save"
        [loading]="inFlight()"
        [disabled]="inFlight()"
        (onClick)="save()"
        [attr.aria-label]="texts.saveAriaLabel"
        data-testid="node-tags-save"
      />
      <p-button
        size="small"
        severity="secondary"
        [label]="texts.cancel"
        [disabled]="inFlight()"
        (onClick)="cancelEdit()"
        [attr.aria-label]="texts.cancelAriaLabel"
        data-testid="node-tags-cancel"
      />
    </div>

    @if (error(); as err) {
      <span class="node-tags__error" role="alert" data-testid="node-tags-error">
        <i class="pi pi-exclamation-triangle" aria-hidden="true"></i>
        <span class="node-tags__error-text">{{ err }}</span>
        <button
          type="button"
          class="node-tags__error-dismiss"
          [attr.aria-label]="texts.dismissErrorAriaLabel"
          (click)="dismissError()"
          data-testid="node-tags-error-dismiss"
        >
          <i class="pi pi-times" aria-hidden="true"></i>
        </button>
      </span>
    }
  </div>
}
