<div
  class="kind-palette-search"
  [class.kind-palette-search--expanded]="searchExpanded()"
  [class.kind-palette-search--active]="searchActive()"
  data-testid="kind-palette-search"
>
  <button
    type="button"
    class="kind-palette-search__icon"
    [pTooltip]="searchExpanded() ? texts.search.closeTooltip : texts.search.openTooltip"
    tooltipPosition="right"
    [attr.aria-label]="searchExpanded() ? texts.search.closeTooltip : texts.search.openTooltip"
    [attr.aria-expanded]="searchExpanded()"
    (click)="toggleSearch()"
    data-testid="kind-palette-search-toggle"
  >
    <i class="pi pi-search" aria-hidden="true"></i>
  </button>
  <input
    #searchInput
    type="text"
    class="kind-palette-search__input"
    [placeholder]="texts.search.placeholder"
    [attr.aria-label]="texts.search.inputAriaLabel"
    [value]="filters.searchText()"
    (input)="onSearchInput($any($event.target).value)"
    (keydown)="onSearchKeydown($event)"
    (blur)="onSearchBlur()"
    [attr.tabindex]="searchExpanded() ? 0 : -1"
    data-testid="kind-palette-search-input"
  />
</div>

<div class="kind-palette" role="toolbar" [attr.aria-label]="texts.a11y.toolbarLabel" data-testid="kind-palette">
  @for (entry of entries(); track entry.kind) {
    <p-togglebutton
      [ngModel]="isActive(entry.kind)"
      (ngModelChange)="toggle(entry.kind)"
      [pTooltip]="entry.label"
      [ariaLabel]="entry.label"
      [styleClass]="'kind-palette__btn kind-palette__btn--' + entry.kind"
      [pt]="$any({ content: { class: 'kind-palette__content' } })"
      [attr.data-testid]="'kind-palette-' + entry.kind"
    >
      <ng-template #content>
        <sm-kind-icon [kind]="entry.kind" [size]="16" />
        <span>{{ entry.count }}</span>
      </ng-template>
    </p-togglebutton>
  }
  @if (showFavorites()) {
    <p-togglebutton
      [ngModel]="favoritesActive()"
      (ngModelChange)="toggleFavoritesOnly()"
      [pTooltip]="texts.favorites.label"
      [ariaLabel]="texts.favorites.label"
      styleClass="kind-palette__btn kind-palette__btn--favorites"
      [pt]="$any({ content: { class: 'kind-palette__content' } })"
      data-testid="kind-palette-favorites"
    >
      <ng-template #content>
        <i
          class="pi"
          [class.pi-star-fill]="favoritesActive()"
          [class.pi-star]="!favoritesActive()"
          aria-hidden="true"
        ></i>
        <span>{{ favoritesCount() }}</span>
      </ng-template>
    </p-togglebutton>
  }
</div>
