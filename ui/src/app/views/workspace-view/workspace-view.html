<div class="workspace" data-testid="workspace-view">
  <aside
    class="workspace__rail"
    [class.is-collapsed]="railCollapsed()"
    [class.is-animating]="railAnimating()"
    [style.width.px]="railCollapsed() ? null : clampedRailWidth()"
    [attr.aria-label]="texts.rail.label"
    data-testid="workspace-rail"
  >
    @if (railCollapsed()) {
      <!-- Collapsed: a vertical activity bar of open-section buttons. The
           panel is closed, so no button reads as "selected", the lit /
           tab-selected state belongs to the open tab strip below. Built as
           a simple vertical list so more sections can be added. -->
      <div
        class="workspace__activity-bar"
        role="toolbar"
        [attr.aria-label]="texts.sections.ariaLabel"
      >
        <button
          type="button"
          class="workspace__rail-btn"
          [pTooltip]="texts.sections.filesTooltip"
          tooltipPosition="right"
          [attr.aria-label]="texts.sections.filesTooltip"
          (click)="openSection('files')"
          data-testid="workspace-section-files"
        >
          <i class="pi pi-folder" aria-hidden="true"></i>
        </button>
        <button
          type="button"
          class="workspace__rail-btn"
          [pTooltip]="texts.sections.queueTooltip"
          tooltipPosition="right"
          [attr.aria-label]="texts.sections.queueTooltip"
          (click)="openSection('queue')"
          data-testid="workspace-section-queue"
        >
          <i class="pi pi-list" aria-hidden="true"></i>
        </button>
      </div>
    } @else {
      <!-- Open: a tab strip (Files / Queue) plus the collapse chevron,
           above the shared search cluster and the swappable body. -->
      <div class="workspace__rail-tabs">
        <!-- The tablist wraps ONLY the tabs (aria-required-children: a
             tablist may not contain the collapse chevron); display:
             contents hands the flex layout to the outer strip. -->
        <div
          class="workspace__rail-tablist"
          role="tablist"
          [attr.aria-label]="texts.sections.ariaLabel"
        >
        <button
          type="button"
          class="workspace__tab"
          role="tab"
          id="workspace-tab-files"
          [class.is-active]="activeSection() === 'files'"
          [attr.aria-selected]="activeSection() === 'files'"
          [attr.tabindex]="activeSection() === 'files' ? 0 : -1"
          aria-controls="workspace-rail-body"
          (click)="openSection('files')"
          data-testid="workspace-section-files"
        >
          <i class="pi pi-folder" aria-hidden="true"></i>
          <span>{{ texts.sections.files }}</span>
        </button>
        <button
          type="button"
          class="workspace__tab"
          role="tab"
          id="workspace-tab-queue"
          [class.is-active]="activeSection() === 'queue'"
          [attr.aria-selected]="activeSection() === 'queue'"
          [attr.tabindex]="activeSection() === 'queue' ? 0 : -1"
          aria-controls="workspace-rail-body"
          (click)="openSection('queue')"
          data-testid="workspace-section-queue"
        >
          <i class="pi pi-list" aria-hidden="true"></i>
          <span>{{ texts.sections.queue }}</span>
        </button>
        </div>
        <!-- Chevron: collapse-only, shown ONLY when open (no glyph swap). -->
        <button
          type="button"
          class="workspace__rail-btn workspace__rail-collapse"
          [pTooltip]="texts.rail.collapse"
          tooltipPosition="bottom"
          [attr.aria-label]="texts.rail.collapse"
          (click)="collapse()"
          data-testid="workspace-rail-toggle"
        >
          <i class="pi pi-angle-left" aria-hidden="true"></i>
        </button>
      </div>

      <!-- In-panel chrome for FILES only: a compact search + the map / follow
           / reset toggles. Exclusive to the Files section (search filters the
           file tree and, via the map toggle, the graph), so it is gated on the
           active tab and hidden on Queue. -->
      @if (activeSection() === 'files') {
      <div class="workspace__rail-bar">
        <p-iconfield iconPosition="left" class="workspace__search">
          <p-inputicon styleClass="pi pi-search" />
          <input
            pInputText
            pSize="small"
            type="text"
            class="workspace__search-input"
            [placeholder]="texts.rail.searchPlaceholder"
            [attr.aria-label]="texts.rail.searchAriaLabel"
            [ngModel]="searchText()"
            (ngModelChange)="onSearchChange($event)"
            data-testid="workspace-search"
          />
          <!-- In-input clear: appears only while the field has text, sits
               over the input's right padding. Clears just the query. -->
          @if (searchText().length > 0) {
            <button
              type="button"
              class="workspace__search-clear"
              [pTooltip]="texts.rail.searchClear"
              tooltipPosition="bottom"
              [attr.aria-label]="texts.rail.searchClear"
              (click)="clearSearch()"
              data-testid="workspace-search-clear"
            >
              <i class="pi pi-times" aria-hidden="true"></i>
            </button>
          }
        </p-iconfield>
        <!-- Search → map coupling. ON (default): the query narrows both
             the files rail and the map. OFF: the map keeps its layout
             and only the files rail filters down to the matches. -->
        <button
          type="button"
          class="workspace__rail-btn workspace__search-map-toggle"
          [class.is-active]="searchAffectsMap()"
          [pTooltip]="searchAffectsMap() ? texts.rail.searchMapOn : texts.rail.searchMapOff"
          tooltipPosition="bottom"
          [attr.aria-label]="searchAffectsMap() ? texts.rail.searchMapOn : texts.rail.searchMapOff"
          [attr.aria-pressed]="searchAffectsMap()"
          (click)="onToggleSearchMap()"
          data-testid="workspace-search-map-toggle"
        >
          <i class="pi pi-map" aria-hidden="true"></i>
        </button>
        <!-- Files follows selection. ON: selecting a node on the map reveals
             it in the tree (highlight + auto-expand + scroll). OFF (default):
             the rail ignores the map selection. -->
        <button
          type="button"
          class="workspace__rail-btn workspace__files-follow-toggle"
          [class.is-active]="filesFollow()"
          [pTooltip]="filesFollow() ? texts.rail.followOn : texts.rail.followOff"
          tooltipPosition="bottom"
          [attr.aria-label]="filesFollow() ? texts.rail.followOn : texts.rail.followOff"
          [attr.aria-pressed]="filesFollow()"
          (click)="onToggleFilesFollow()"
          data-testid="workspace-files-follow-toggle"
        >
          <i class="pi pi-arrow-right-arrow-left" aria-hidden="true"></i>
        </button>
        <!-- Reset: clears the map folder selection (show all) AND every
             facet filter, returning the workspace to its default overview.
             Disabled when there is nothing active to reset. -->
        <button
          type="button"
          class="workspace__rail-btn"
          [disabled]="!canReset()"
          [pTooltip]="texts.rail.resetTooltip"
          tooltipPosition="bottom"
          [attr.aria-label]="texts.rail.reset"
          (click)="resetView()"
          data-testid="workspace-reset-filters"
        >
          <i class="pi pi-filter-slash" aria-hidden="true"></i>
        </button>
      </div>
      }

      <!-- Body: swaps its child on the active section. Only the active
           section's component is mounted, so each tab boots fresh. -->
      <div
        class="workspace__rail-body"
        id="workspace-rail-body"
        role="tabpanel"
        [attr.aria-labelledby]="activeSection() === 'files' ? 'workspace-tab-files' : 'workspace-tab-queue'"
      >
        @if (activeSection() === 'files') {
          <sm-files-view />
        } @else {
          <sm-queue-view />
        }
      </div>
      <div
        class="workspace__rail-resize"
        role="separator"
        tabindex="0"
        aria-orientation="vertical"
        [attr.aria-label]="texts.rail.resize"
        [attr.aria-valuenow]="railWidth()"
        [attr.aria-valuemin]="railResizeMin"
        [attr.aria-valuemax]="railResizeMax()"
        (mousedown)="onRailResizeStart($event)"
        (keydown.arrowleft)="onRailResizeKey('narrower')"
        (keydown.arrowright)="onRailResizeKey('wider')"
        data-testid="workspace-rail-resize"
      ></div>
    }
  </aside>

  <div class="workspace__map">
    <sm-graph-view />
  </div>
</div>
