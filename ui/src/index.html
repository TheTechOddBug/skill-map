<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>skill-map</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Runtime-mode discriminator. `live` makes the SPA talk to the BFF
      (`sm serve`); the demo build pipeline (Step 14.3.b) rewrites
      `content` to `demo` and bundles a precomputed snapshot alongside.
    -->
    <meta name="skill-map-mode" content="live" />
    <!--
      Adaptive SVG favicon: the file carries an inline `prefers-color-scheme`
      <style> block that flips strokes/fills between dark and light browser
      tabs. The PNG entry is a last-resort fallback for ancient clients that
      don't render SVG favicons. Mirrors web/index.html so the SPA and the
      marketing site share one source of truth.
    -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <!--
      Matrix-theme font (JetBrains Mono). Loaded once via Google Fonts; the
      @font-face stylesheet is lazy (browsers only fetch the binary when
      an element actually uses 'JetBrains Mono'), so non-matrix users pay
      nothing for the glyph payload. Applied via `html.app-matrix` in
      `themes/matrix.css`.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" />
  </head>
  <body>
    <sm-root></sm-root>
  </body>
</html>
