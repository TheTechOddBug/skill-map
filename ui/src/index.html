<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>skill-map</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Strip the Referer header on every request + outbound link. The
      loopback BFF does not need it, and external links from rendered
      markdown should not leak the in-app route the operator came from.
    -->
    <meta name="referrer" content="no-referrer" />
    <!--
      Runtime-mode discriminator. `live` makes the SPA talk to the BFF
      (`sm serve`); the demo build pipeline (Step 14.3.b) rewrites
      `content` to `demo` and bundles a precomputed snapshot alongside.
    -->
    <meta name="skill-map-mode" content="live" />
    <!-- Dev-harness stamp: the Angular dev server serves this file RAW
         (the BFF meta injection never touches it), so the storage
         version gate would sit inert there. "dev" is a stable
         pseudo-version: the gate stamps it once and equality holds on
         every later load. Under a real serve the BFF injects its own
         skill-map-version right after <head>, which wins by document
         order; the demo patch strips this one before stamping the real
         version. -->
    <meta name="skill-map-version" content="dev" />
    <!--
      Adaptive SVG favicon: the file carries an inline `prefers-color-scheme`
      <style> block that flips strokes/fills between dark and light browser
      tabs. The PNG entry is a last-resort fallback for ancient clients that
      don't render SVG favicons. Mirrors web/index.html so the SPA and the
      marketing site share one source of truth.
    -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <!--
      Matrix-theme font (JetBrains Mono) is injected lazily by
      ThemeService the first time the user activates matrix mode, so
      non-matrix users pay neither the stylesheet fetch nor the
      preconnect handshake on first paint. Applied via `html.app-matrix`
      in `themes/matrix.css`.
    -->
  </head>
  <body>
    <sm-root></sm-root>
  </body>
</html>
