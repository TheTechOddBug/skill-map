<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64" fill="none">
  <!--
    Neon-green-theme favicon. Activated by `ThemeService` (effect) when
    `extraTheme === 'neon-green'`, swapped back to `favicon.svg` when
    the theme clears. Stroke ramp mirrors `skill-map-mark-neon-green.svg`
    (accent-dim triangle, accent vertex) so the tab glyph reads as the
    same brand mark in electric green.
  -->
  <line x1="16" y1="20" x2="48" y2="20" stroke="#22C55E" stroke-width="3.5" stroke-linecap="round" />
  <line x1="16" y1="20" x2="32" y2="48" stroke="#22C55E" stroke-width="3.5" stroke-linecap="round" />
  <line x1="48" y1="20" x2="32" y2="48" stroke="#22C55E" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="16" cy="20" r="6" fill="#22C55E" />
  <circle cx="48" cy="20" r="6" fill="#22C55E" />
  <circle cx="32" cy="48" r="8" fill="#2BF57E" />
</svg>
