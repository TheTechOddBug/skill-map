<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64" fill="none">
  <!--
    Neon-red-theme favicon. Activated by `ThemeService` (effect) when
    `extraTheme === 'neon-red'`, swapped back to `favicon.svg` when the
    theme clears. Stroke ramp mirrors `skill-map-mark-neon-red.svg`
    (accent-dim triangle, accent vertex) so the tab glyph reads as the
    same brand mark in crimson.
  -->
  <line x1="16" y1="20" x2="48" y2="20" stroke="#F43F5E" stroke-width="3.5" stroke-linecap="round" />
  <line x1="16" y1="20" x2="32" y2="48" stroke="#F43F5E" stroke-width="3.5" stroke-linecap="round" />
  <line x1="48" y1="20" x2="32" y2="48" stroke="#F43F5E" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="16" cy="20" r="6" fill="#F43F5E" />
  <circle cx="48" cy="20" r="6" fill="#F43F5E" />
  <circle cx="32" cy="48" r="8" fill="#FF3355" />
</svg>
