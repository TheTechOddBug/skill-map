name: Bug report
description: Report something in skill-map that does not work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Bug reports are welcome even though external pull requests are paused until v1.0. A clear report helps us fix it fast.

        skill-map scans Markdown, so the fastest fix comes from the **smallest set of `.md` files that still reproduces the bug**. See how to reduce a real project down to that minimum: [Reporting a bug: minimal reproduction](https://github.com/crystian/skill-map/blob/main/CONTRIBUTING.md#reporting-a-bug-minimal-reproduction).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Describe the bug and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, including the exact command(s) you ran.
      placeholder: |
        1. Run `sm scan`
        2. Open the UI
        3. ...
    validations:
      required: true
  - type: textarea
    id: minimal-repro
    attributes:
      label: Minimal reproduction (the .md files)
      description: |
        Share the smallest set of `.md` files that still triggers the bug, and nothing else. Paste the file tree plus each file's contents below, or drag a `.zip` of that minimal tree into this box.

        To get there: start from your real project, delete files and folders and re-run the command until it stops reproducing (keep only what is still needed), then strip each remaining file down to the least content that still fails. Most reports land at 1 to 3 short files. Full procedure in the [contributing guide](https://github.com/crystian/skill-map/blob/main/CONTRIBUTING.md#reporting-a-bug-minimal-reproduction).
      placeholder: |
        skills/
        └─ broken/
           └─ SKILL.md

        --- skills/broken/SKILL.md ---
        ---
        name: broken
        ---
        See [missing](./does-not-exist.md)
    validations:
      required: true
  - type: input
    id: sm-version
    attributes:
      label: skill-map version
      description: Output of `sm --version`.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS and Node version (`node --version`).
      placeholder: Ubuntu 24.04, Node 24.3.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Relevant CLI output, ideally `sm scan --json` run on the minimal reproduction above, or the error text. Rendered as code, no backticks needed.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I reduced the reproduction to the fewest `.md` files that still trigger the bug.
          required: true
