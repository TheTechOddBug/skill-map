name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '.changeset/*.md'
      - '.claude/**'
      - '.githooks/**'
      - 'context/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'ROADMAP.md'
  pull_request:
    paths-ignore:
      - '.changeset/*.md'
      - '.claude/**'
      - '.githooks/**'
      - 'context/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'ROADMAP.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate spec + integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Parse-check every JSON schema
        run: |
          fail=0
          while IFS= read -r f; do
            if ! node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" 2>/dev/null; then
              echo "::error file=$f::invalid JSON"
              fail=1
            fi
          done < <(find spec/schemas -name '*.schema.json')
          exit $fail

      # Spec integrity (index hashes + coverage matrix) and the public-site
      # build (schema $id alignment) are now covered by `pnpm validate`
      # in the build-test job — the spec and web workspaces validate
      # themselves end-to-end. Only the JSON parse-check stays here as a
      # cheap, install-script-free guard so a malformed schema fails the
      # validate job before the heavier orchestrator runs.

  build-test:
    name: build + test
    runs-on: ubuntu-latest
    # Bound the job so a stalled Playwright download (the CDN occasionally
    # hangs mid-fetch) fails fast instead of burning the GitHub default 6h
    # timeout. The browser install below is capped at 2x300s = 10 min on a
    # cold cache, leaving the rest for `pnpm validate`. Once the cache is
    # warm the install is instant and the job runs well under this.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Cache the Playwright browser binaries so the e2e smoke does not
      # re-download from cdn.playwright.dev on every run. The key tracks
      # e2e/package.json, where @playwright/test is pinned exactly AND
      # `install:browsers` names the artifact; a browser revision only
      # changes when that file bumps, so the cache invalidates precisely
      # when it must (no restore-keys: a stale revision is useless and must
      # force a fresh download).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package.json') }}

      # Install the browser up front with a per-attempt ceiling and a
      # retry. On a cache hit Playwright returns instantly; on a miss
      # `timeout` caps each attempt so a CDN stall cannot hang the job. The
      # e2e `prevalidate:test` hook re-runs `install:browsers` during `pnpm
      # validate` but finds the browser already present here.
      #
      # `install:browsers` fetches `chromium-headless-shell` (~85MB), NOT
      # the full Chrome (~170MB): every e2e project runs headless, and
      # Playwright uses the headless shell for headless runs. The old full
      # `playwright install chromium` pulled Chrome + headless-shell +
      # ffmpeg (~250MB); the SIGTERM hit the second download on a slow CDN,
      # so the job never cached a browser and re-downloaded forever. 300s
      # is generous margin for the smaller artifact.
      - name: Install Playwright browsers (retried)
        run: |
          for attempt in 1 2; do
            if timeout 300 pnpm --filter skill-map-e2e run install:browsers; then
              break
            fi
            if [ "$attempt" = "2" ]; then
              echo "playwright install stalled or failed after 2 attempts"
              exit 1
            fi
            echo "attempt $attempt failed (likely a CDN stall); retrying in 5s"
            sleep 5
          done

      - name: Validate (typecheck + lint + build + test for every workspace)
        run: pnpm validate

  smoke-install:
    name: smoke install (tarball)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build (tsup)
        run: pnpm --filter @skill-map/cli build

      - name: Pack workspaces
        run: |
          mkdir -p .tmp/packs
          pnpm --filter @skill-map/spec pack --pack-destination=.tmp/packs
          pnpm --filter @skill-map/cli pack --pack-destination=.tmp/packs

      - name: Verify tarball contents
        run: |
          # pnpm pack has no --dry-run flag (unlike npm), so we inspect
          # the freshly produced tarball directly. The `package/` prefix
          # is the standard layout npm uses inside tarballs.
          cli_tgz=$(ls .tmp/packs/skill-map-cli-*.tgz | head -n 1)
          tar -tzf "$cli_tgz" | sed 's|^package/||' | node -e '
            const lines = require("fs").readFileSync(0, "utf8").split("\n").filter(Boolean);
            const files = lines.filter((f) => !f.endsWith("/"));
            const required = [
              "bin/sm.js",
              "dist/cli.js",
              "dist/index.js",
              "dist/kernel/index.js",
              "dist/conformance/index.js",
              "dist/migrations/001_initial.sql",
              "package.json",
            ];
            const missing = required.filter((r) => !files.includes(r));
            if (missing.length) {
              console.error("Missing in tarball:", missing.join(", "));
              process.exit(1);
            }
            console.log("Tarball contents OK (" + files.length + " files).");
          '

      - name: Install globally from tarballs
        run: |
          # End users install `sm` via `npm i -g @skill-map/cli`, so the
          # smoke install replays that flow with npm (which ships with
          # every Node runner) rather than pnpm. This stage validates the
          # published artifact's compatibility with the npm install path,
          # not the monorepo's package manager choice.
          spec_tgz=$(ls .tmp/packs/skill-map-spec-*.tgz | head -n 1)
          cli_tgz=$(ls .tmp/packs/skill-map-cli-*.tgz | head -n 1)
          npm i -g "$spec_tgz" "$cli_tgz"

      - name: Verify CLI surface
        run: |
          sm --version
          skill-map --version
          sm --help > /dev/null
          test -f "$(npm root -g)/@skill-map/cli/dist/migrations/001_initial.sql"

      - name: Verify init + scan flow on a temp dir
        run: |
          workdir=$(mktemp -d)
          cd "$workdir"
          # CLAUDE.md is Claude's documented project-context file and one of
          # the few `.md` paths the Claude Provider claims at the project
          # root (along with `.claude/`, `notes/`). Since multi-provider
          # tightened classify() to disclaim foreign paths, an arbitrary
          # `a.md` in root would be skipped by every Provider and yield 0
          # nodes — defeating the smoke test.
          echo "# hello" > CLAUDE.md
          sm init --no-scan
          test -f .skill-map/skill-map.db
          sm scan --json . > scan.json
          test -s scan.json
          node -e '
            const r = JSON.parse(require("fs").readFileSync("scan.json", "utf8"));
            if (!Array.isArray(r.nodes) || r.nodes.length === 0) {
              console.error("scan output missing nodes[]");
              process.exit(1);
            }
            console.log("scan produced " + r.nodes.length + " node(s).");
          '

  changeset:
    name: require changeset on PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Check for changeset
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node scripts/check-changeset.js "origin/${BASE_REF}"
