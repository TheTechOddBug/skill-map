name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '.changeset/*.md'
      - '.claude/**'
      - '.githooks/**'
      - 'context/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'ROADMAP.md'
  pull_request:
    paths-ignore:
      - '.changeset/*.md'
      - '.claude/**'
      - '.githooks/**'
      - 'context/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'ROADMAP.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate spec + integrity
    runs-on: ubuntu-latest
    # Skip on the changesets "version packages" PR: it only bumps
    # package.json versions + CHANGELOG.md, code the push-CI already
    # validated on the same commit. Re-running here is redundant and is
    # the run GitHub gates behind "Approve and run" (bot-authored PR).
    if: github.head_ref != 'changeset-release/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Parse-check every JSON schema
        run: |
          fail=0
          while IFS= read -r f; do
            if ! node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" 2>/dev/null; then
              echo "::error file=$f::invalid JSON"
              fail=1
            fi
          done < <(find spec/schemas -name '*.schema.json')
          exit $fail

      # Spec integrity (index hashes + coverage matrix) is covered by the
      # `cli` job and the public-site build (schema $id alignment) by
      # the `ui` job, the spec and web workspaces validate themselves end-to-end.
      # Only the JSON parse-check stays here as a cheap, install-script-free
      # guard so a malformed schema fails this job before the heavier lanes
      # run.

  # ---------------------------------------------------------------------------
  # The validate suite runs as TWO PARALLEL LANES, not one serial job.
  #
  # It used to be a single `pnpm validate`, and that job kept dying for reasons
  # that were all the same reason. The `@skill-map/cli` leg alone is ~70% of the
  # wall clock and swings hard with runner luck (596s / 805s / 828s measured on
  # the same suite), so on a slow runner it spent the entire budget before e2e
  # started, and its `node --test` fan-out over 401 files starved unrelated
  # async waits badly enough to expire a 4s timeout on work that takes 40ms.
  #
  # Splitting fixes both: wall clock drops to the slower lane instead of the
  # sum, and each lane gets an event loop that is not fighting the other. Raising
  # timeouts treated the symptom; this treats the cause.
  #
  # The cut follows the real dependency graph, not an even split:
  #   - the cli job needs no browser, so it skips the Playwright image entirely
  #     (only `e2e/` depends on playwright) and saves the image pull too.
  #   - the ui job is self-sufficient WITHOUT the cli build: `demo:build` prefers
  #     `src/dist/cli.js` but falls back to the source entry through tsx
  #     (`web/scripts/build-demo-dataset.js` §runScan), and `ensure-ui-build.js`
  #     reuses the `ui/dist` this lane just produced.
  # Each lane's composition lives in a root package script so it stays
  # reproducible locally (`pnpm ci:cli`), not buried in YAML.
  # ---------------------------------------------------------------------------
  cli:
    name: build + test (cli)
    runs-on: ubuntu-latest
    # Skipped on the release commit itself, for two independent reasons.
    #
    # It cannot gate anything: `release.yml` has no `needs:` on this workflow.
    # It builds both packages, runs `spec:check` and publishes on the SAME push,
    # so npm has the tarball long before these lanes finish. A red X here is
    # therefore unactionable, nothing un-publishes and the remedy would be a new
    # patch release, not a fix on main.
    #
    # And it is near-vacuous: a version commit changes versions, changelogs,
    # `spec/index.json` and `ui/src/data/user-changelog.json`, never source, so
    # the code is byte-identical to the commit CI validated one push earlier.
    # The cheap `validate` job above still runs and keeps the JSON parse-check
    # honest on the regenerated `spec/index.json`.
    #
    # Two shapes reach `main`: the changesets PR lands as a merge commit naming
    # `changeset-release/main`, and a local `pnpm release:version` push (the RC
    # runbook's path) lands as `chore: version packages`. On a `pull_request`
    # event `head_commit` is null, so `contains` is false and PRs always run.
    # If changesets ever renames its branch or message this stops matching and
    # CI merely runs redundantly again, which is the safe direction to fail.
    if: >-
      github.head_ref != 'changeset-release/main'
      && !contains(github.event.head_commit.message, 'changeset-release/main')
      && !startsWith(github.event.head_commit.message, 'chore: version packages')
    # Hang backstop, not a budget. Back to 20 now that the split moved ui and
    # e2e out of this job: the 30 was sized for a job that carried everything.
    #
    # Measured on the first green split run: 727s of tests + 155s of conformance
    # + ~60s of checkout/install/compile = 15m42s total. The test leg is the
    # variable part (596s / 727s / 806s / 828s observed across runs), so the
    # worst case seen so far lands near 17m20s, leaving roughly 2.5 minutes of
    # headroom. That is deliberately thin: this bound exists to kill a hang
    # quickly, and a false kill here is cheap to spot (the log ends mid-suite
    # with everything passing) whereas a hang burning 30 minutes is not.
    # If it starts firing on healthy runs, the answer is to shard the cli suite,
    # not to raise this back.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Validate spec + cli (typecheck + lint + build + tests + conformance)
        run: pnpm ci:cli

  ui:
    name: build + test (ui + e2e)
    runs-on: ubuntu-latest
    # Same release-commit skip as the `cli` job above; see its comment for why.
    # GitHub Actions does not support YAML anchors in workflows, so the
    # condition is repeated rather than shared.
    if: >-
      github.head_ref != 'changeset-release/main'
      && !contains(github.event.head_commit.message, 'changeset-release/main')
      && !startsWith(github.event.head_commit.message, 'chore: version packages')
    # Run inside the official Playwright image: Chromium + the headless
    # shell ship preinstalled at /ms-playwright (the image exports
    # PLAYWRIGHT_BROWSERS_PATH), so the e2e smoke never touches the flaky
    # cdn.playwright.dev, which kept SIGTERM-ing mid-download. The tag MUST
    # track @playwright/test in e2e/package.json so the bundled browser
    # revision matches; on a mismatch the `prevalidate:test` hook would fall
    # back to a CDN download. Bump both together.
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    # Hang backstop. This lane measured ~6 min end to end; the headroom is for
    # the image pull and a contended runner.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # The Playwright image ships its own Node, but the repo targets Node
      # 24 (sm's `>=24` guard + node:sqlite); setup-node installs it into
      # the container and puts it first on PATH.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # No browser-install step: the container already has them at
      # /ms-playwright. The e2e `prevalidate:test` hook still runs
      # `playwright install chromium-headless-shell`, but it finds the
      # matching revision present and skips the download.
      - name: Validate ui + web + e2e (build + tests + smoke)
        run: pnpm ci:ui

  smoke-install:
    name: smoke install (tarball)
    runs-on: ubuntu-latest
    # Only the cli lane gates this: it packs and installs the CLI tarball.
    needs: cli
    if: github.head_ref != 'changeset-release/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build (tsup)
        run: pnpm --filter @skill-map/cli build

      - name: Pack workspaces
        run: |
          mkdir -p .tmp/packs
          pnpm --filter @skill-map/spec pack --pack-destination=.tmp/packs
          pnpm --filter @skill-map/cli pack --pack-destination=.tmp/packs

      - name: Verify tarball contents
        run: |
          # pnpm pack has no --dry-run flag (unlike npm), so we inspect
          # the freshly produced tarball directly. The `package/` prefix
          # is the standard layout npm uses inside tarballs.
          cli_tgz=$(ls .tmp/packs/skill-map-cli-*.tgz | head -n 1)
          tar -tzf "$cli_tgz" | sed 's|^package/||' | node -e '
            const lines = require("fs").readFileSync(0, "utf8").split("\n").filter(Boolean);
            const files = lines.filter((f) => !f.endsWith("/"));
            const required = [
              "bin/sm.js",
              "dist/cli.js",
              "dist/index.js",
              "dist/kernel/index.js",
              "dist/conformance/index.js",
              "dist/migrations/001_initial.sql",
              "package.json",
            ];
            const missing = required.filter((r) => !files.includes(r));
            if (missing.length) {
              console.error("Missing in tarball:", missing.join(", "));
              process.exit(1);
            }
            console.log("Tarball contents OK (" + files.length + " files).");
          '

      - name: Install globally from tarballs
        run: |
          # End users install `sm` via `npm i -g @skill-map/cli`, so the
          # smoke install replays that flow with npm (which ships with
          # every Node runner) rather than pnpm. This stage validates the
          # published artifact's compatibility with the npm install path,
          # not the monorepo's package manager choice.
          spec_tgz=$(ls .tmp/packs/skill-map-spec-*.tgz | head -n 1)
          cli_tgz=$(ls .tmp/packs/skill-map-cli-*.tgz | head -n 1)
          npm i -g "$spec_tgz" "$cli_tgz"

      - name: Verify CLI surface
        run: |
          sm --version
          skill-map --version
          sm --help > /dev/null
          test -f "$(npm root -g)/@skill-map/cli/dist/migrations/001_initial.sql"

      - name: Verify init + scan flow on a temp dir
        run: |
          workdir=$(mktemp -d)
          cd "$workdir"
          # CLAUDE.md is Claude's documented project-context file and one of
          # the few `.md` paths the Claude Provider claims at the project
          # root (along with `.claude/`, `notes/`). Since multi-provider
          # tightened classify() to disclaim foreign paths, an arbitrary
          # `a.md` in root would be skipped by every Provider and yield 0
          # nodes — defeating the smoke test.
          echo "# hello" > CLAUDE.md
          sm init --no-scan
          test -f .skill-map/skill-map.db
          sm scan --json . > scan.json
          test -s scan.json
          node -e '
            const r = JSON.parse(require("fs").readFileSync("scan.json", "utf8"));
            if (!Array.isArray(r.nodes) || r.nodes.length === 0) {
              console.error("scan output missing nodes[]");
              process.exit(1);
            }
            console.log("scan produced " + r.nodes.length + " node(s).");
          '

  changeset:
    name: require changeset on PR
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Check for changeset
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node scripts/check-changeset.js "origin/${BASE_REF}"
