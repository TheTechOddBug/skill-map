packages:
  - spec
  - src
  - ui
  - e2e
  - web

# Dependency version overrides. pnpm v11 reads these from here, not from
# the root package.json `pnpm.overrides` block (which it silently ignores).
overrides:
  # Pin a transitive `fast-uri` (latest is 4.x) to the 3.x line. 3.1.4 is
  # the PATCHED 3.x: GHSA-v2hh-gcrm-f6hx / GHSA-4c8g-83qw-93j6 (host
  # confusion via a backslash authority delimiter, failed IDN
  # canonicalization) hit `>=3.0.0 <=3.1.3`. Reached through
  # `@modelcontextprotocol/sdk > ajv`, which AJV-validates plugin
  # manifests and job reports, so a `format: "uri"` check on an
  # attacker-authored string is in scope. ajv wants `^3.0.1`, so the
  # patched release stays inside the range it already accepts.
  fast-uri: 3.1.4
  # Same tree, same reason: `@modelcontextprotocol/sdk` still bundles a
  # vulnerable express subtree at 1.30.0 (bumping the SDK does not clear
  # these). Both are the patched release on the major the dependent
  # already requires, so nothing crosses a breaking boundary.
  #   qs          GHSA-q8mj-m7cp-5q26, DoS, hit >=6.11.1 <=6.15.1
  #   body-parser GHSA-v422-hmwv-36x6, DoS, hit >=2.0.0 <2.3.0
  qs: 6.15.3
  body-parser: 2.3.0
  # `posthog-js` bundles an old `dompurify` (3.4.5) that trips several
  # low/moderate advisories. Force it to the patched 3.4.12 the UI already
  # depends on directly, so the shipped bundle carries one clean copy.
  dompurify: 3.4.12

# Allowlist of dependencies whose install scripts are permitted to run.
# strict-dep-builds=true (in .npmrc) blocks every postinstall by default,
# so each entry below is a deliberate decision documented inline.
#
# Add a new entry only when `pnpm install` reports ERR_PNPM_IGNORED_BUILDS
# for a package the build actually needs. Default-deny is the point.
allowBuilds:
  # Bundler native binary used by tsup, Vite, Angular CLI, and Vitest.
  # Without the postinstall the JS fallback is ~10x slower and breaks
  # the cold-start budgets in CI.
  esbuild: true

  # File-system watcher with native bindings used by Angular dev server
  # and Vitest's watch mode. Falls back to chokidar polling when the
  # native binding is missing, which burns CPU on Linux/WSL.
  '@parcel/watcher': true

  # Embedded key-value store with native code. Pulled in transitively
  # by tooling that caches resolver state; skipping the build forces a
  # JS-only fallback that does not boot.
  lmdb: true

  # Optional native accelerator for msgpackr serialization. The pure-JS
  # path is correct and fast enough for our scan/event payloads, so we
  # skip the postinstall to keep the install surface smaller.
  msgpackr-extract: false

  # Rust-based module resolver shipped by unimport / oxc. Optional
  # acceleration; the default JS resolver works for this monorepo.
  unrs-resolver: false

  # Pulled in transitively by posthog (usage telemetry). core-js's
  # postinstall only prints a funding banner; protobufjs's only generates
  # its `pbjs`/`pbts` CLI helpers, which we never invoke. Skip both.
  core-js: false
  protobufjs: false
